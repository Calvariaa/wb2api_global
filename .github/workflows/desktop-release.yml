name: Build Windows desktop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-desktop-lock.txt
      - name: Verify release tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content desktop/version.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match desktop/version.json' }
      - run: python -m pip install -r requirements-desktop-lock.txt
      - run: python scripts/check_runtime.py
      - run: python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-windows-x64
          path: |
            dist/*.exe
            dist/*.sha256
